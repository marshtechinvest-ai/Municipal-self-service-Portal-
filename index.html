<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    ==========================================================
    Municipal Self-Service Portal
    Harare City Council — Demo Digital Billing Platform

    Description:
    A modern responsive municipal billing and payment portal
    built using React + TailwindCSS + Chart.js.

    Instructions:
    1. Save this file as index.html
    2. Open directly in any modern browser
    3. No installation or backend required

    Technologies:
    - React via CDN
    - Babel Standalone
    - TailwindCSS CDN
    - Chart.js CDN
    ==========================================================
  -->

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Municipal Self-Service Portal</title>

  <!-- TailwindCSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .glass {
      backdrop-filter: blur(12px);
      background: rgba(255,255,255,0.75);
    }

    .dark .glass {
      background: rgba(17,24,39,0.75);
    }

    .fade-in {
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0px);
      }
    }

    .spinner {
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 35px;
      height: 35px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    html {
      scroll-behavior: smooth;
    }
  </style>
</head>

<body class="bg-slate-100 dark:bg-slate-900 transition-all duration-300">

<div id="root"></div>

<script type="text/babel">

const { useState, useEffect, useRef } = React;

/* =========================================================
   MOCK DATA
========================================================= */

const mockTransactions = [
  { id: 1, date: "2026-05-01", amount: "$120", status: "Paid", method: "EcoCash" },
  { id: 2, date: "2026-04-12", amount: "$75", status: "Paid", method: "Visa" },
  { id: 3, date: "2026-03-03", amount: "$96", status: "Pending", method: "ZIPIT" },
];

const billingHistory = [
  { month: "January", amount: "$85", status: "Paid" },
  { month: "February", amount: "$95", status: "Paid" },
  { month: "March", amount: "$105", status: "Pending" },
  { month: "April", amount: "$115", status: "Pending" },
];

const requestHistory = [
  { type: "Water Leak", status: "In Progress" },
  { type: "Billing Query", status: "Resolved" },
  { type: "Sewer Blockage", status: "Pending" },
];

/* =========================================================
   TOAST COMPONENT
========================================================= */

function Toast({ message, onClose }) {
  useEffect(() => {
    const timer = setTimeout(() => {
      onClose();
    }, 3000);

    return () => clearTimeout(timer);
  }, []);

  return (
    <div className="fixed top-5 right-5 z-50 bg-green-600 text-white px-5 py-3 rounded-xl shadow-2xl animate-bounce">
      <div className="flex items-center gap-3">
        <i className="fa-solid fa-circle-check"></i>
        {message}
      </div>
    </div>
  );
}

/* =========================================================
   LOADING SPINNER
========================================================= */

function LoadingScreen() {
  return (
    <div className="fixed inset-0 bg-slate-900 flex items-center justify-center z-50">
      <div className="text-center text-white">
        <div className="spinner mx-auto mb-4"></div>
        <p className="text-xl font-semibold">Loading Municipal Portal...</p>
      </div>
    </div>
  );
}

/* =========================================================
   NAVBAR
========================================================= */

function Navbar({ currentPage, setCurrentPage, darkMode, setDarkMode }) {
  const [menuOpen, setMenuOpen] = useState(false);

  const navItems = [
    "Home",
    "Billing",
    "Payments",
    "Requests",
    "Admin",
    "Contact",
    "Login"
  ];

  return (
    <nav className="sticky top-0 z-40 bg-white/90 dark:bg-slate-800/90 backdrop-blur-lg shadow-lg">
      <div className="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">

        <div className="flex items-center gap-3">
          <div className="w-11 h-11 rounded-xl bg-gradient-to-r from-blue-600 to-green-500 flex items-center justify-center text-white text-xl shadow-lg">
            <i className="fa-solid fa-building-columns"></i>
          </div>

          <div>
            <h1 className="font-extrabold text-lg text-slate-800 dark:text-white">
              Municipal Self-Service Portal
            </h1>
            <p className="text-xs text-slate-500 dark:text-slate-300">
              Harare City Council
            </p>
          </div>
        </div>

        <div className="hidden md:flex items-center gap-6">
          {navItems.map(item => (
            <button
              key={item}
              onClick={() => setCurrentPage(item)}
              className={`font-medium transition hover:text-blue-600 ${
                currentPage === item
                  ? "text-blue-600"
                  : "text-slate-700 dark:text-slate-200"
              }`}
            >
              {item}
            </button>
          ))}

          <button
            onClick={() => setDarkMode(!darkMode)}
            className="bg-slate-200 dark:bg-slate-700 w-11 h-11 rounded-full"
          >
            {darkMode ? "☀️" : "🌙"}
          </button>
        </div>

        <button
          className="md:hidden text-2xl text-slate-700 dark:text-white"
          onClick={() => setMenuOpen(!menuOpen)}
        >
          <i className="fa-solid fa-bars"></i>
        </button>
      </div>

      {menuOpen && (
        <div className="md:hidden bg-white dark:bg-slate-800 px-4 pb-5">
          {navItems.map(item => (
            <button
              key={item}
              onClick={() => {
                setCurrentPage(item);
                setMenuOpen(false);
              }}
              className="block w-full text-left py-3 text-slate-700 dark:text-white"
            >
              {item}
            </button>
          ))}

          <button
            onClick={() => setDarkMode(!darkMode)}
            className="mt-4 bg-blue-600 text-white px-4 py-2 rounded-xl"
          >
            Toggle Theme
          </button>
        </div>
      )}
    </nav>
  );
}

/* =========================================================
   DASHBOARD CARDS
========================================================= */

function StatCard({ icon, title, value, color }) {
  return (
    <div className="bg-white dark:bg-slate-800 rounded-3xl p-6 shadow-xl hover:scale-105 transition duration-300 fade-in">
      <div className="flex justify-between items-center">
        <div>
          <p className="text-slate-500 dark:text-slate-300 text-sm">
            {title}
          </p>
          <h2 className="text-3xl font-extrabold mt-2 text-slate-800 dark:text-white">
            {value}
          </h2>
        </div>

        <div className={`w-14 h-14 rounded-2xl ${color} text-white flex items-center justify-center text-2xl shadow-lg`}>
          <i className={icon}></i>
        </div>
      </div>
    </div>
  );
}

/* =========================================================
   CHART COMPONENT
========================================================= */

function DashboardChart() {
  const chartRef = useRef(null);

  useEffect(() => {
    const ctx = chartRef.current;

    const chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May'],
        datasets: [{
          label: 'Revenue Collection',
          data: [1200, 1900, 1400, 2200, 2600],
          borderRadius: 10
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: {
            labels: {
              color: '#64748b'
            }
          }
        },
        scales: {
          y: {
            ticks: {
              color: '#64748b'
            }
          },
          x: {
            ticks: {
              color: '#64748b'
            }
          }
        }
      }
    });

    return () => chart.destroy();

  }, []);

  return (
    <div className="bg-white dark:bg-slate-800 rounded-3xl p-6 shadow-xl">
      <h3 className="text-xl font-bold mb-4 dark:text-white">
        Revenue Analytics
      </h3>

      <canvas ref={chartRef}></canvas>
    </div>
  );
}

/* =========================================================
   HOME PAGE
========================================================= */

function HomePage({ setToast }) {

  return (
    <div className="space-y-8 fade-in">

      <div className="bg-gradient-to-r from-blue-700 to-green-600 rounded-3xl p-8 text-white shadow-2xl">
        <div className="flex flex-col md:flex-row justify-between gap-6 items-center">

          <div>
            <h1 className="text-4xl font-black mb-3">
              Welcome to Harare City Council Portal
            </h1>

            <p className="text-blue-100 max-w-2xl">
              Access bills, make payments, submit service requests,
              download statements and manage your municipal services online.
            </p>

            <div className="flex gap-3 mt-6 flex-wrap">
              <button
                onClick={() => setToast("Redirecting to Payment Portal")}
                className="bg-white text-blue-700 px-6 py-3 rounded-2xl font-bold shadow-lg hover:scale-105 transition"
              >
                Pay Bill
              </button>

              <button className="bg-black/20 px-6 py-3 rounded-2xl font-bold hover:bg-black/30 transition">
                Download Statement
              </button>
            </div>
          </div>

          <div className="text-8xl opacity-20">
            <i className="fa-solid fa-city"></i>
          </div>
        </div>
      </div>

      <div className="bg-red-100 border-l-4 border-red-600 p-5 rounded-2xl">
        <div className="flex items-center gap-3">
          <i className="fa-solid fa-triangle-exclamation text-red-600"></i>
          <p className="font-semibold text-red-700">
            Your municipal account has outstanding balances requiring attention.
          </p>
        </div>
      </div>

      <div className="grid md:grid-cols-4 gap-6">

        <StatCard
          icon="fa-solid fa-money-bill-wave"
          title="Outstanding Balance"
          value="$145"
          color="bg-red-500"
        />

        <StatCard
          icon="fa-solid fa-credit-card"
          title="Last Payment"
          value="$120"
          color="bg-green-500"
        />

        <StatCard
          icon="fa-solid fa-calendar-days"
          title="Next Due Date"
          value="15 May"
          color="bg-blue-500"
        />

        <StatCard
          icon="fa-solid fa-file-circle-check"
          title="Active Requests"
          value="3"
          color="bg-purple-500"
        />

      </div>

      <div className="grid md:grid-cols-4 gap-4">
        <button className="bg-blue-600 text-white p-5 rounded-2xl shadow-xl hover:scale-105 transition">
          <i className="fa-solid fa-wallet text-2xl mb-2"></i>
          <p className="font-bold">Pay Bill</p>
        </button>

        <button className="bg-green-600 text-white p-5 rounded-2xl shadow-xl hover:scale-105 transition">
          <i className="fa-solid fa-download text-2xl mb-2"></i>
          <p className="font-bold">Download Statement</p>
        </button>

        <button className="bg-orange-500 text-white p-5 rounded-2xl shadow-xl hover:scale-105 transition">
          <i className="fa-solid fa-triangle-exclamation text-2xl mb-2"></i>
          <p className="font-bold">Report Issue</p>
        </button>

        <button className="bg-slate-700 text-white p-5 rounded-2xl shadow-xl hover:scale-105 transition">
          <i className="fa-solid fa-phone text-2xl mb-2"></i>
          <p className="font-bold">Contact Council</p>
        </button>
      </div>

      <DashboardChart />

      <div className="bg-white dark:bg-slate-800 rounded-3xl shadow-xl p-6 overflow-auto">
        <div className="flex justify-between items-center mb-4">
          <h3 className="text-xl font-bold dark:text-white">
            Recent Transactions
          </h3>

          <span className="bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm font-bold">
            Live Updates
          </span>
        </div>

        <table className="w-full">
          <thead>
            <tr className="text-left text-slate-500 border-b">
              <th className="py-3">Date</th>
              <th>Amount</th>
              <th>Status</th>
              <th>Method</th>
            </tr>
          </thead>

          <tbody>
            {mockTransactions.map(tx => (
              <tr key={tx.id} className="border-b dark:border-slate-700">
                <td className="py-4 dark:text-white">{tx.date}</td>
                <td className="dark:text-white">{tx.amount}</td>
                <td>
                  <span className={`px-3 py-1 rounded-full text-sm font-bold ${
                    tx.status === "Paid"
                      ? "bg-green-100 text-green-700"
                      : "bg-yellow-100 text-yellow-700"
                  }`}>
                    {tx.status}
                  </span>
                </td>
                <td className="dark:text-white">{tx.method}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <FAQSection />

    </div>
  );
}

/* =========================================================
   LOGIN PAGE
========================================================= */

function LoginPage({ setToast }) {

  const handleLogin = (e) => {
    e.preventDefault();
    setToast("Login Successful");
  };

  return (
    <div className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8 fade-in">

      <div className="bg-white dark:bg-slate-800 rounded-3xl shadow-2xl p-8">

        <h2 className="text-3xl font-black mb-2 dark:text-white">
          Citizen Login
        </h2>

        <p className="text-slate-500 dark:text-slate-300 mb-8">
          Secure access to your municipal account
        </p>

        <form className="space-y-5" onSubmit={handleLogin}>

          <div>
            <label className="font-semibold dark:text-white">
              Account Number
            </label>

            <input
              type="text"
              placeholder="ACC-2026-001"
              className="w-full mt-2 p-4 rounded-2xl border dark:bg-slate-700 dark:text-white"
            />
          </div>

          <div>
            <label className="font-semibold dark:text-white">
              Password
            </label>

            <input
              type="password"
              placeholder="********"
              className="w-full mt-2 p-4 rounded-2xl border dark:bg-slate-700 dark:text-white"
            />
          </div>

          <div className="flex justify-between items-center">
            <label className="flex items-center gap-2 dark:text-white">
              <input type="checkbox"/>
              Remember Me
            </label>

            <a href="#" className="text-blue-600 font-semibold">
              Forgot Password?
            </a>
          </div>

          <button className="w-full bg-gradient-to-r from-blue-600 to-green-500 text-white py-4 rounded-2xl font-bold hover:scale-[1.02] transition">
            Login
          </button>

        </form>
      </div>

      <div className="bg-gradient-to-br from-blue-700 to-green-600 rounded-3xl shadow-2xl p-8 text-white">

        <h2 className="text-3xl font-black mb-5">
          Register New Account
        </h2>

        <div className="space-y-4">

          <input
            type="text"
            placeholder="Full Name"
            className="w-full p-4 rounded-2xl bg-white/20 placeholder-white"
          />

          <input
            type="email"
            placeholder="Email Address"
            className="w-full p-4 rounded-2xl bg-white/20 placeholder-white"
          />

          <input
            type="text"
            placeholder="National ID"
            className="w-full p-4 rounded-2xl bg-white/20 placeholder-white"
          />

          <input
            type="password"
            placeholder="Create Password"
            className="w-full p-4 rounded-2xl bg-white/20 placeholder-white"
          />

          <button
            onClick={() => setToast("Registration Successful")}
            className="w-full bg-white text-blue-700 py-4 rounded-2xl font-black"
          >
            Create Account
          </button>

        </div>
      </div>

    </div>
  );
}

/* =========================================================
   BILLING PAGE
========================================================= */

function BillingPage() {

  return (
    <div className="space-y-8 fade-in">

      <div className="grid md:grid-cols-3 gap-6">

        <StatCard
          icon="fa-solid fa-file-invoice-dollar"
          title="Outstanding Balance"
          value="$145"
          color="bg-red-500"
        />

        <StatCard
          icon="fa-solid fa-gauge"
          title="Meter Reading"
          value="4589"
          color="bg-blue-500"
        />

        <StatCard
          icon="fa-solid fa-calendar"
          title="Due Date"
          value="15 May"
          color="bg-green-500"
        />
      </div>

      <div className="bg-white dark:bg-slate-800 rounded-3xl p-8 shadow-xl">

        <h2 className="text-2xl font-black mb-6 dark:text-white">
          Current Bill Summary
        </h2>

        <div className="grid md:grid-cols-2 gap-6">

          <div className="space-y-4">
            <div className="flex justify-between dark:text-white">
              <span>Water Charges</span>
              <span>$45</span>
            </div>

            <div className="flex justify-between dark:text-white">
              <span>Refuse Collection</span>
              <span>$25</span>
            </div>

            <div className="flex justify-between dark:text-white">
              <span>Sewer Charges</span>
              <span>$35</span>
            </div>

            <div className="flex justify-between dark:text-white">
              <span>Rates & Taxes</span>
              <span>$40</span>
            </div>

            <div className="border-t pt-4 flex justify-between font-black text-xl dark:text-white">
              <span>Total</span>
              <span>$145</span>
            </div>
          </div>

          <div className="bg-slate-100 dark:bg-slate-700 rounded-2xl p-6 flex flex-col justify-center items-center">
            <i className="fa-solid fa-file-pdf text-red-500 text-6xl mb-4"></i>

            <button className="bg-red-600 text-white px-6 py-3 rounded-2xl font-bold">
              Download PDF Statement
            </button>
          </div>
        </div>
      </div>

      <div className="bg-white dark:bg-slate-800 rounded-3xl shadow-xl p-6 overflow-auto">
        <h2 className="text-2xl font-black mb-5 dark:text-white">
          Billing History
        </h2>

        <table className="w-full">
          <thead>
            <tr className="text-left border-b text-slate-500">
              <th className="py-3">Month</th>
              <th>Amount</th>
              <th>Status</th>
            </tr>
          </thead>

          <tbody>
            {billingHistory.map((bill, index) => (
              <tr key={index} className="border-b dark:border-slate-700">
                <td className="py-4 dark:text-white">{bill.month}</td>
                <td className="dark:text-white">{bill.amount}</td>
                <td>
                  <span className={`px-3 py-1 rounded-full text-sm font-bold ${
                    bill.status === "Paid"
                      ? "bg-green-100 text-green-700"
                      : "bg-yellow-100 text-yellow-700"
                  }`}>
                    {bill.status}
                  </span>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

    </div>
  );
}

/* =========================================================
   PAYMENT PAGE
========================================================= */

function PaymentsPage({ setToast }) {

  const [showReceipt, setShowReceipt] = useState(false);

  const handlePayment = (e) => {
    e.preventDefault();

    setToast("Payment Successful");
    setShowReceipt(true);
  };

  return (
    <div className="grid lg:grid-cols-2 gap-8 fade-in">

      <div className="bg-white dark:bg-slate-800 rounded-3xl p-8 shadow-2xl">

        <h2 className="text-3xl font-black mb-6 dark:text-white">
          Online Payment
        </h2>

        <form className="space-y-5" onSubmit={handlePayment}>

          <div>
            <label className="font-semibold dark:text-white">
              Payment Amount
            </label>

            <input
              type="number"
              placeholder="145"
              className="w-full mt-2 p-4 rounded-2xl border dark:bg-slate-700 dark:text-white"
            />
          </div>

          <div>
            <label className="font-semibold dark:text-white">
              Payment Method
            </label>

            <div className="grid grid-cols-2 gap-4 mt-3">

              {["EcoCash", "OneMoney", "Visa/Mastercard", "ZIPIT"].map(method => (
                <button
                  key={method}
                  type="button"
                  className="border p-4 rounded-2xl hover:bg-blue-50 dark:hover:bg-slate-700 dark:text-white"
                >
                  {method}
                </button>
              ))}

            </div>
          </div>

          <div className="bg-slate-100 dark:bg-slate-700 rounded-2xl p-6 text-center">

            <i className="fa-solid fa-qrcode text-7xl text-slate-500"></i>

            <p className="mt-3 text-slate-600 dark:text-slate-300">
              QR Code Payment Placeholder
            </p>
          </div>

          <button className="w-full bg-gradient-to-r from-green-600 to-blue-600 text-white py-4 rounded-2xl font-black hover:scale-[1.02] transition">
            Complete Payment
          </button>

        </form>
      </div>

      <div className="space-y-6">

        <div className="bg-white dark:bg-slate-800 rounded-3xl shadow-xl p-6">
          <h3 className="text-2xl font-black mb-5 dark:text-white">
            Payment History
          </h3>

          <div className="space-y-4">
            {mockTransactions.map(tx => (
              <div
                key={tx.id}
                className="border dark:border-slate-700 rounded-2xl p-4 flex justify-between items-center"
              >
                <div>
                  <p className="font-bold dark:text-white">{tx.amount}</p>
                  <p className="text-sm text-slate-500">{tx.date}</p>
                </div>

                <span className="bg-green-100 text-green-700 px-3 py-1 rounded-full font-bold text-sm">
                  {tx.status}
                </span>
              </div>
            ))}
          </div>
        </div>

        {showReceipt && (
          <div className="bg-green-50 border border-green-200 rounded-3xl p-6 shadow-xl">
            <div className="text-center">
              <i className="fa-solid fa-circle-check text-green-600 text-6xl"></i>

              <h3 className="text-2xl font-black mt-4 text-green-700">
                Payment Successful
              </h3>

              <p className="text-slate-600 mt-2">
                Digital receipt generated successfully.
              </p>

              <button className="mt-5 bg-green-600 text-white px-6 py-3 rounded-2xl font-bold">
                Download Receipt
              </button>
            </div>
          </div>
        )}

      </div>

    </div>
  );
}

/* =========================================================
   SERVICE REQUESTS PAGE
========================================================= */

function RequestsPage({ setToast }) {

  return (
    <div className="space-y-8 fade-in">

      <div className="grid lg:grid-cols-3 gap-6">

        {[
          "Report Water Leak",
          "Report Sewer Blockage",
          "Billing Query"
        ].map((title, index) => (
          <div
            key={index}
            className="bg-white dark:bg-slate-800 rounded-3xl p-6 shadow-xl"
          >
            <h3 className="text-xl font-black mb-4 dark:text-white">
              {title}
            </h3>

            <textarea
              placeholder="Describe issue..."
              className="w-full p-4 rounded-2xl border h-32 dark:bg-slate-700 dark:text-white"
            ></textarea>

            <button
              onClick={() => setToast("Service Request Submitted")}
              className="mt-4 w-full bg-blue-600 text-white py-3 rounded-2xl font-bold"
            >
              Submit Request
            </button>
          </div>
        ))}

      </div>

      <div className="bg-white dark:bg-slate-800 rounded-3xl shadow-xl p-6">
        <h2 className="text-2xl font-black mb-6 dark:text-white">
          Request History
        </h2>

        <div className="grid md:grid-cols-3 gap-5">

          {requestHistory.map((req, index) => (
            <div
              key={index}
              className="border dark:border-slate-700 rounded-2xl p-5"
            >
              <div className="flex justify-between items-center mb-4">
                <h4 className="font-bold dark:text-white">
                  {req.type}
                </h4>

                <span className="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm font-bold">
                  {req.status}
                </span>
              </div>

              <p className="text-slate-500">
                Tracking ID: HCC-REQ-00{index+1}
              </p>
            </div>
          ))}

        </div>
      </div>

    </div>
  );
}

/* =========================================================

/* =========================================================
   CONTACT PAGE
========================================================= */

function ContactPage({ setToast }) {

    <div className="grid lg:grid-cols-2 gap-8 fade-in">

      <div className="bg-white dark:bg-slate-800 rounded-3xl shadow-xl p-8">

        <h2 className="text-3xl font-black mb-6 dark:text-white">
          Contact Council
        </h2>

        <div className="space-y-6">

          <div className="flex gap-4 items-start">
            <div className="bg-blue-100 text-blue-700 w-12 h-12 rounded-2xl flex items-center justify-center">
              <i className="fa-solid fa-location-dot"></i>
            </div>

            <div>
              <h4 className="font-bold dark:text-white">Office Location</h4>
              <p className="text-slate-500">
                Town House, Jason Moyo Avenue, Harare
              </p>
            </div>
          </div>

          <div className="flex gap-4 items-start">
            <div className="bg-green-100 text-green-700 w-12 h-12 rounded-2xl flex items-center justify-center">
              <i className="fa-solid fa-phone"></i>
            </div>

            <div>
              <h4 className="font-bold dark:text-white">Phone Numbers</h4>
              <p className="text-slate-500">
                +263 242 123 456
              </p>
            </div>
          </div>

          <div className="flex gap-4 items-start">
            <div className="bg-purple-100 text-purple-700 w-12 h-12 rounded-2xl flex items-center justify-center">
              <i className="fa-solid fa-envelope"></i>
            </div>

            <div>
              <h4 className="font-bold dark:text-white">Email</h4>
              <p className="text-slate-500">
                support@hararecity.gov.zw
              </p>
            </div>
          </div>

        </div>

        <div className="mt-8 bg-slate-200 dark:bg-slate-700 h-64 rounded-3xl flex items-center justify-center text-slate-500">

            <i className="fa-solid fa-map-location-dot text-6xl mb-3"></i>

      <div className="bg-gradient-to-br from-blue-700 to-green-600 rounded-3xl shadow-2xl p-8 text-white">

        <h2 className="text-3xl font-black mb-6">
          Send Us A Message
        </h2>

        <div className="space-y-5">

          <input
            type="text"

            className="w-full p-4 rounded-2xl bg-white/20 placeholder-white"

            type="email"

/* =========================================================
   FAQ SECTION
========================================================= */

function FAQSection() {

  const faqs = [
    {
      q: "How do I pay my municipal bill?",
      a: "You can pay using EcoCash, ZIPIT, Visa/Mastercard or OneMoney."
    },
    {
      q: "How do I report a water leak?",
      a: "Navigate to Service Requests and submit a Water Leak report."
    },
    {
      q: "Can I download statements?",
      a: "Yes, PDF statements are available in the Billing section."
    }
  ];

  const [openIndex, setOpenIndex] = useState(null);

  return (
    <div className="bg-white dark:bg-slate-800 rounded-3xl shadow-xl p-8">

      <h2 className="text-3xl font-black mb-6 dark:text-white">
        Frequently Asked Questions
      </h2>

      <div className="space-y-4">

        {faqs.map((faq, index) => (
          <div
            key={index}
            className="border dark:border-slate-700 rounded-2xl overflow-hidden"
          >

            <button
              onClick={() => setOpenIndex(openIndex === index ? null : index)}
              className="w-full flex justify-between items-center p-5 font-bold dark:text-white"
            >
              {faq.q}
              <i className={`fa-solid ${openIndex === index ? "fa-minus" : "fa-plus"}`}></i>
            </button>

            {openIndex === index && (
              <div className="px-5 pb-5 text-slate-600 dark:text-slate-300">
                {faq.a}
              </div>
            )}

          </div>
        ))}

      </div>
    </div>
  );
}

/* =========================================================
   CHATBOT
========================================================= */

function ChatBot() {

  const [open, setOpen] = useState(false);

  const messages = [
    {
      sender: "bot",
      text: "Hello 👋 I am CouncilBot. How may I assist you today?"
    },
    {
      sender: "user",
      text: "How do I pay my bill?"
    },
    {
      sender: "bot",
      text: "Go to the Payments section and choose your preferred payment method."
    }
  ];

  return (
    <>
      <button
        onClick={() => setOpen(!open)}
        className="fixed bottom-6 right-6 w-16 h-16 rounded-full bg-gradient-to-r from-blue-600 to-green-500 text-white shadow-2xl text-2xl z-50 hover:scale-110 transition"
      >
        <i className="fa-solid fa-robot"></i>
      </button>

      {open && (
        <div className="fixed bottom-24 right-6 w-96 max-w-[95%] bg-white dark:bg-slate-800 rounded-3xl shadow-2xl overflow-hidden z-50">

          <div className="bg-gradient-to-r from-blue-600 to-green-500 text-white p-5 flex justify-between items-center">
            <div>
              <h3 className="font-black text-lg">
                CouncilBot
              </h3>
              <p className="text-sm opacity-90">
                Municipal AI Assistant
              </p>
            </div>

            <button onClick={() => setOpen(false)}>
              <i className="fa-solid fa-xmark"></i>
            </button>
          </div>

          <div className="p-5 h-80 overflow-auto space-y-4">

            {messages.map((msg, index) => (
              <div
                key={index}
                className={`p-4 rounded-2xl max-w-[85%] ${
                  msg.sender === "bot"
                    ? "bg-slate-100 dark:bg-slate-700 dark:text-white"
                    : "bg-blue-600 text-white ml-auto"
                }`}
              >
                {msg.text}
              </div>
            ))}

          </div>

          <div className="p-4 border-t dark:border-slate-700 flex gap-3">
            <input
              type="text"
              placeholder="Type message..."
              className="flex-1 p-3 rounded-2xl border dark:bg-slate-700 dark:text-white"
            />

            <button className="bg-blue-600 text-white px-5 rounded-2xl">
              Send
            </button>
          </div>

        </div>
      )}
    </>
  );
}

/* =========================================================
   MAIN APP
========================================================= */

function App() {

  const [currentPage, setCurrentPage] = useState("Home");
  const [loading, setLoading] = useState(true);
  const [toast, setToast] = useState("");
  const [darkMode, setDarkMode] = useState(false);

  useEffect(() => {
    setTimeout(() => {
      setLoading(false);
    }, 1800);
  }, []);

  useEffect(() => {
    if (darkMode) {
      document.documentElement.classList.add("dark");
    } else {
      document.documentElement.classList.remove("dark");
    }
  }, [darkMode]);

  if (loading) {
    return <LoadingScreen />;
  }

  return (
    <div className="min-h-screen">

      <Navbar
        currentPage={currentPage}
        setCurrentPage={setCurrentPage}
        darkMode={darkMode}
        setDarkMode={setDarkMode}
      />

      <main className="max-w-7xl mx-auto p-4 md:p-6">

        {currentPage === "Home" && (
          <HomePage setToast={setToast} />
        )}

        {currentPage === "Login" && (
          <LoginPage setToast={setToast} />
        )}

        {currentPage === "Billing" && (
          <BillingPage />
        )}

        {currentPage === "Payments" && (
          <PaymentsPage setToast={setToast} />
        )}

        {currentPage === "Requests" && (
          <RequestsPage setToast={setToast} />
        )}

        {currentPage === "Admin" && (
          <AdminDashboard />
        )}

        {currentPage === "Contact" && (
          <ContactPage setToast={setToast} />
        )}

      </main>

      <footer className="mt-16 bg-slate-900 text-white py-10">
        <div className="max-w-7xl mx-auto px-6 grid md:grid-cols-3 gap-8">

          <div>
            <h3 className="text-2xl font-black mb-4">
              Municipal Self-Service Portal
            </h3>

            <p className="text-slate-400">
              Modern digital municipal services platform for councils in Zimbabwe.
            </p>
          </div>

          <div>
            <h4 className="font-bold mb-4">
              Quick Links
            </h4>

            <div className="space-y-2 text-slate-400">
              <p>Pay Bills</p>
              <p>Service Requests</p>
              <p>Billing Statements</p>
              <p>Contact Support</p>
            </div>
          </div>

          <div>
            <h4 className="font-bold mb-4">
              Notifications
            </h4>

            <div className="bg-white/10 p-4 rounded-2xl">
              <p className="text-sm">
                SMS & Email notifications enabled for billing reminders and payment confirmations.
              </p>
            </div>
          </div>

        </div>

        <div className="border-t border-white/10 mt-8 pt-6 text-center text-slate-500">
          © 2026 Harare City Council — Municipal Self-Service Portal
        </div>
      </footer>

      <ChatBot />

      {toast && (
        <Toast
          message={toast}
          onClose={() => setToast("")}
        />
      )}

    </div>
  );
}

/* =========================================================
   RENDER APP
========================================================= */

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>

</body>
</html>
